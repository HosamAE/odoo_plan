<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'nonce-{{nonce}}'; script-src 'nonce-{{nonce}}';">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit Odoo</title>
<style nonce="{{nonce}}">
/* Every colour is the editor's own, each with a fallback: a variable a theme does not define would otherwise drop the
   whole declaration (that is how the day map once lost its grid in dark mode). */
:root {
  --fg: var(--vscode-foreground, #cccccc);
  --muted: var(--vscode-descriptionForeground, #9d9d9d);
  --bg: var(--vscode-editor-background, #1e1e1e);
  --card: var(--vscode-sideBar-background, #252526);
  --line: var(--vscode-panel-border, #3c3c3c);
  --accent: var(--vscode-focusBorder, #007fd4);
  --btn-bg: var(--vscode-button-background, #0e639c);
  --btn-fg: var(--vscode-button-foreground, #ffffff);
  --btn2-bg: var(--vscode-button-secondaryBackground, #3a3d41);
  --btn2-fg: var(--vscode-button-secondaryForeground, #cccccc);
  --input-bg: var(--vscode-input-background, #3c3c3c);
  --input-fg: var(--vscode-input-foreground, #cccccc);
  --ok: var(--vscode-testing-iconPassed, #73c991);
  --warn: var(--vscode-editorWarning-foreground, #cca700);
  --bad: var(--vscode-errorForeground, #f48771);
  --mono: var(--vscode-editor-font-family, Consolas, "Courier New", monospace);
}
* { box-sizing: border-box; }
body { margin: 0; padding: 12px 16px 24px; color: var(--fg); background: var(--bg); font: 13px/1.45 var(--vscode-font-family, "Segoe UI", sans-serif); }
h1 { font-size: 15px; margin: 0; font-weight: 600; }
h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.top { display: flex; align-items: center; gap: 10px; margin: -12px -16px 12px; padding: 9px 16px; flex-wrap: wrap; background: var(--card); border-bottom: 1px solid var(--line); }
.top .sub { color: var(--muted); }
.top .spacer { flex: 1; }
.top .brand { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; padding-right: 10px; border-right: 1px solid var(--line); }
.pill.link { cursor: pointer; }
.banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; margin: 0 0 10px; border: 1px solid var(--warn); border-radius: 8px; background: color-mix(in srgb, var(--warn) 12%, transparent); }
.banner[hidden] { display: none; }
.banner .spacer { flex: 1; }
.top .acts { display: flex; gap: 6px; align-items: center; }
.livedot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted); }
.livedot.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.livedot.warn { background: var(--warn); } .livedot.bad { background: var(--bad); }
.grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 760px) { .grid { grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.4fr); } .grid > .col:nth-child(3) { grid-column: 1 / -1; } }
@media (min-width: 1150px) { .grid { grid-template-columns: minmax(280px, 340px) minmax(380px, 1.3fr) minmax(320px, 1fr); } .grid > .col:nth-child(3) { grid-column: auto; } }
.tabs { display: flex; gap: 2px; overflow-x: auto; flex: none; border-bottom: 1px solid var(--line); margin: 0 0 12px; }
.tab { white-space: nowrap; background: transparent; color: var(--muted); border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 7px 14px; transition: color .12s; }
.tab:hover { color: var(--fg); filter: none; }
.tab.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
/* In the bottom panel the page has little height: it fills what it is given, and each column scrolls on its own. */
body.panel { padding: 6px 10px 8px; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
body.panel .top { margin: -6px -10px 4px; padding: 6px 10px; }
body.panel .door { min-height: 0; padding: 10px 12px; }
body.panel .door .big { font-size: 17px; }
body.panel .tabs { margin-bottom: 6px; }
body.panel .page { flex: 1; min-height: 0; overflow: auto; }
body.panel #logcard, body.panel #issues { height: 100%; }
body.panel .scroll { max-height: none; }
body.panel #log { height: calc(100vh - 170px); min-height: 100px; }
.page[hidden] { display: none; }
.badge { display: inline-block; min-width: 16px; margin-left: 6px; padding: 0 5px; border-radius: 999px; font-size: 10px; font-weight: 700; text-align: center; color: var(--btn-fg); }
.badge.bad { background: var(--bad); } .badge.warn { background: var(--warn); color: #1e1e1e; }
.doors { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.door { text-align: left; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-height: 132px; display: flex; flex-direction: column; gap: 5px; cursor: pointer; transition: border-color .12s, transform .12s; }
.door:hover, .door:focus-visible { border-color: var(--accent); }
.door:hover { transform: translateY(-1px); }
.door .dh { display: flex; align-items: baseline; gap: 8px; }
.door .dh b { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.door .dh .go { margin-left: auto; color: var(--accent); font-size: 12px; }
.door .big { color: var(--fg); font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.door .line { color: var(--muted); font-size: 12px; min-height: 17px; }
.door .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 8px; }
table.servers td, table.servers th { white-space: nowrap; }
tr.focus td { background: var(--vscode-list-activeSelectionBackground, rgba(0, 127, 212, .25)); }
.col.wide { max-width: 900px; }
.progressrow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.pill { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid currentColor; background: color-mix(in srgb, currentColor 13%, transparent); }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); } .pill.idle { color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 2px 8px; margin: 6px 0; }
.kv span:nth-child(odd) { color: var(--muted); }
button { background: var(--btn-bg); color: var(--btn-fg); border: 0; border-radius: 4px; padding: 4px 12px; cursor: pointer; font: inherit; transition: filter .12s; }
button:hover:not(:disabled) { filter: brightness(1.15); }
button.secondary { background: var(--btn2-bg); color: var(--btn2-fg); }
button.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
button.small { padding: 1px 7px; font-size: 12px; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
input[type=text], select { background: var(--input-bg); color: var(--input-fg); border: 1px solid var(--line); border-radius: 3px; padding: 3px 7px; font: inherit; min-width: 0; }
.bar { height: 8px; background: var(--btn2-bg); border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
.hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
.hint.warn { color: var(--warn); } .hint.bad { color: var(--bad); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
tbody tr:hover td { background: var(--vscode-list-hoverBackground, rgba(255, 255, 255, .04)); }
th { color: var(--muted); font-weight: 600; font-size: 11px; cursor: pointer; user-select: none; }
td.num, th.num { text-align: right; }
tr.sel td { background: var(--vscode-list-activeSelectionBackground, rgba(0, 127, 212, .25)); }
tr.dim td { opacity: .55; }
tr.row-db { cursor: pointer; }
.scroll { overflow: auto; max-height: 280px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 0 9px; cursor: pointer; background: transparent; color: var(--fg); font-size: 12px; }
.chip.on { background: var(--accent); color: var(--btn-fg); border-color: var(--accent); }
.issue { display: flex; gap: 6px; padding: 3px 0; border-bottom: 1px solid var(--line); cursor: pointer; align-items: baseline; }
.issue:hover { background: var(--vscode-list-hoverBackground, rgba(255, 255, 255, .06)); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; margin-top: 3px; }
.dot.error { background: var(--bad); } .dot.warning { background: var(--warn); }
.issue .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.issue .meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
#log { font: 12px/1.4 var(--mono); height: 300px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 0; }
#log div { padding: 0 8px; white-space: pre-wrap; word-break: break-all; border-left: 3px solid transparent; cursor: pointer; }
#log div.error { background: rgba(244, 71, 71, .16); border-left-color: var(--bad); }
#log div.warning { background: rgba(204, 167, 0, .14); border-left-color: var(--warn); }
#log div:hover { outline: 1px solid var(--line); }
#log .n { color: var(--muted); margin-right: 8px; user-select: none; }
.toast { position: fixed; right: 14px; bottom: 14px; max-width: 420px; padding: 8px 12px; border-radius: 4px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(0, 0, 0, .4); }
.toast.bad { border-color: var(--bad); } .toast.warn { border-color: var(--warn); } .toast.ok { border-color: var(--ok); }
.empty { color: var(--muted); padding: 8px 0; }
#graph { margin-top: 12px; }
.maptitle { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 4px 0 8px; }
.maptitle b { font-size: 16px; }
.maptools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 0; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 0 8px; color: var(--muted); font-size: 12px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.mapbox { overflow: auto; max-height: 520px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
body.panel .mapbox { max-height: calc(100vh - 250px); min-height: 160px; }
svg.map { display: block; }
svg.map .edge { fill: none; stroke: var(--muted); stroke-opacity: .45; stroke-width: 1.3; }
svg.map .edge.hl { stroke: var(--accent); stroke-opacity: 1; stroke-width: 2.2; }
svg.map .arrowhead { fill: var(--muted); }
.label { fill: var(--fg); font: 12px var(--vscode-font-family, "Segoe UI", sans-serif); pointer-events: none; }
.node.open { cursor: pointer; }
.node .shape { stroke-width: 1.5; }
.node.open:hover .shape, .node:focus-visible .shape { stroke-width: 2.6; }
.node:focus-visible { outline: none; }
/* what a module is: the project's own, Odoo's, Enterprise, a third party. Shape and outline say it, not colour alone. */
.mn-project .shape { fill: color-mix(in srgb, #3794ff 24%, var(--bg)); stroke: #3794ff; }
.mn-core .shape { fill: color-mix(in srgb, #b05a9a 32%, var(--bg)); stroke: #b05a9a; }
.mn-enterprise .shape { fill: color-mix(in srgb, #e2b93d 22%, var(--bg)); stroke: #e2b93d; stroke-dasharray: 5 3; }
.mn-themes .shape { fill: color-mix(in srgb, #e8844a 22%, var(--bg)); stroke: #e8844a; stroke-dasharray: 5 3; }
.mn-third_party .shape { fill: color-mix(in srgb, #4bb38a 22%, var(--bg)); stroke: #4bb38a; stroke-dasharray: 5 3; }
.mn-unknown .shape { fill: transparent; stroke: var(--muted); stroke-dasharray: 2 3; }
.mn-focus .shape { fill: color-mix(in srgb, var(--accent) 30%, var(--bg)); stroke: var(--accent); stroke-width: 3; }
.mn-focus .label { font-weight: 700; }
.check { display: flex; gap: 8px; align-items: baseline; margin: 3px 0; flex-wrap: wrap; }
.check b { width: 14px; } .check.ok b { color: var(--ok); } .check.bad b { color: var(--bad); } .check.run b { color: var(--warn); } .check.idle, .check.idle b { color: var(--muted); }
.tg { color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; margin: 12px 0 6px; }
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.tool { text-align: left; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.tool:hover { border-color: var(--accent); filter: none; }
.tool b { font-weight: 600; } .tool span { color: var(--muted); font-size: 12px; }
pre.report { font: 12px/1.45 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; margin: 6px 0; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.sr { position: absolute; left: -9999px; }
</style>
</head>
<body>
<div class="top" id="top"></div>
<div class="banner" id="banner" role="status" hidden></div>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="page" id="page-home" data-tab="home">
  <section class="doors" id="home" aria-label="Cockpit"></section>
</div>
<div class="page" id="page-server" data-tab="server" hidden>
  <div class="col wide">
    <section class="card" id="server" aria-label="Server"></section>
    <section class="card" id="progress" aria-label="Progress" hidden></section>
  </div>
</div>
<div class="page" id="page-dbs" data-tab="dbs" hidden>
  <div class="col">
    <section class="card" id="dbs" aria-label="Databases"></section>
    <section class="card" id="modules" aria-label="Modules" hidden></section>
  </div>
</div>
<div class="page" id="page-quality" data-tab="quality" hidden>
  <section class="card" id="quality" aria-label="Quality and CI"></section>
</div>
<div class="page" id="page-log" data-tab="log" hidden>
  <section class="card" id="logcard" aria-label="Server log"></section>
</div>
<div class="page" id="page-issues" data-tab="issues" hidden>
  <section class="card" id="issues" aria-label="Errors and warnings"></section>
</div>
<div class="page" id="page-graph" data-tab="graph" hidden>
  <section class="card" id="graphmap" aria-label="Module map"></section>
  <section class="card" id="graph" aria-label="Project graph"></section>
</div>
<div class="page" id="page-tools" data-tab="tools" hidden>
  <section class="card" id="tools" aria-label="Tools and maintenance"></section>
</div>
<div class="page" id="page-remote" data-tab="remote" hidden>
  <section class="card" id="remote" aria-label="Remote servers"></section>
</div>
<div class="sr" role="status" aria-live="polite" id="live"></div>
<script nonce="{{nonce}}">
(function () {
  "use strict";
  var vscode = typeof acquireVsCodeApi === "function" ? acquireVsCodeApi() : { postMessage: function () {}, getState: function () { return null; }, setState: function () {} };
  var S = null;                                  // the last state the host sent
  var ui = vscode.getState() || { dbSort: "name", dbDesc: false, dbFilter: "", selected: null, logLevel: "all", logSearch: "", modFilter: "attention", autoscroll: true, tab: "home" };
  if (!ui.tab || ui.tab === "local") ui.tab = "home";
  var $ = function (id) { return document.getElementById(id); };

  // Build nodes, never markup strings: log lines and messages are data and may contain anything.
  function h(tag, attrs) {
    var el = document.createElement(tag);
    for (var k in (attrs || {})) {
      if (k === "class") el.className = attrs[k];
      else if (k === "style") el.style.cssText = attrs[k];   // the policy blocks a style ATTRIBUTE in markup; the style OBJECT is allowed
      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] !== null && attrs[k] !== undefined) el.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    }
    function add(child) {
      if (child === null || child === undefined || child === false) return;
      if (Array.isArray(child)) { child.forEach(add); return; }   // a list of nodes is as good as a node
      el.appendChild(typeof child === "object" ? child : document.createTextNode(String(child)));
    }
    for (var i = 2; i < arguments.length; i++) add(arguments[i]);
    return el;
  }
  function put(el, nodes) { el.textContent = ""; nodes.forEach(function (n) { if (n) el.appendChild(n); }); }
  function send(cmd, extra) { var m = { cmd: cmd }; for (var k in (extra || {})) m[k] = extra[k]; vscode.postMessage(m); }
  function save() { vscode.setState(ui); }
  function btn(label, cmd, extra, cls, disabled) {
    return h("button", { class: cls || "", disabled: !!disabled, onclick: function (e) { e.stopPropagation(); send(cmd, extra); } }, label);
  }
  function dur(s) { if (s === null || s === undefined) return ""; s = Math.round(s); return s >= 60 ? Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s" : s + "s"; }

  // ----------------------------------------------------------------------------- the pieces
  function pill(state) {
    var map = { healthy: ["ok", "Healthy"], starting: ["warn", "Starting"], problems: ["warn", "Problems"], failed: ["bad", "Failed"], stopped: ["idle", "Stopped"] };
    var m = map[state] || ["idle", state || "-"];
    return h("span", { class: "pill " + m[0] }, m[1]);
  }

  function renderTop() {
    var p = S.project, sv = S.server, list = sv.list || [], is = S.issues, focus = list.filter(function (x) { return x.focus; })[0];
    var state = sv.running ? (sv.health ? sv.health.state : "starting") : "stopped";
    var tone = { healthy: "ok", starting: "warn", problems: "warn", failed: "bad" }[state] || "";
    function openIssues() { ui.tab = "issues"; save(); render(); }
    put($("top"), [
      h("span", { class: "brand" }, "Cockpit Odoo"),
      h("span", { class: "livedot " + tone }),
      h("h1", {}, p.name),
      h("span", { class: "sub" }, "Odoo " + p.version + " · port " + (focus ? focus.port : p.port) + (list.length > 1 ? " · following 1 of " + list.length : "")),
      pill(state),
      is.errors + (is.warnings || 0) ? h("span", { class: "pill link " + (is.errors ? "bad" : "warn"), role: "button", tabindex: "0", title: "Show the errors and warnings", onclick: openIssues,
        onkeydown: function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openIssues(); } } },
        is.errors ? is.errors + " error" + (is.errors === 1 ? "" : "s") : (is.warnings || 0) + " warning" + (is.warnings === 1 ? "" : "s")) : null,
      h("span", { class: "sub" }, sv.db ? "database " + sv.db : (sv.running ? "no database chosen" : "")),
      h("span", { class: "spacer" }),
      h("div", { class: "acts" }, sv.running
        ? [btn("Open ↗", "open", null, "secondary small"), btn("Restart", "restart", null, "secondary small"), btn("Stop", "stop", null, "danger small")]
        : [btn("Start server", "start", null, "small")]),
    ]);
  }

  function renderServers(nodes) {
    var list = S.server.list || [];
    nodes.push(h("h2", {}, "Running servers" + (list.length ? " (" + list.length + ")" : "")));
    if (!list.length) { nodes.push(h("div", { class: "empty" }, "No Odoo server is running. Start one below.")); return; }
    var table = h("table", { class: "servers" }, h("thead", {}, h("tr", {}, h("th", {}, ""), h("th", {}, "Port"), h("th", {}, "Database"), h("th", {}, "Of"), h("th", {}, "pid"), h("th", {}, ""))));
    var body = h("tbody");
    list.forEach(function (sv) {
      body.appendChild(h("tr", { class: sv.focus ? "focus" : "" },
        h("td", {}, sv.focus ? "●" : ""),
        h("td", {}, ":" + sv.port),
        h("td", {}, sv.db || "none"),
        h("td", {}, sv.mine ? "this project" : "another"),
        h("td", {}, String(sv.pid)),
        h("td", {}, h("div", { class: "row" },
          sv.focus ? null : btn("Follow", "focusServer", { port: sv.port }, "secondary small"),
          btn("Open", "open", { port: sv.port }, "secondary small"),
          btn("Stop", "stopAt", { port: sv.port }, "danger small")))));
    });
    table.appendChild(body);
    nodes.push(h("div", { class: "scroll" }, table));
    if (list.length > 1) nodes.push(h("div", { class: "hint" }, "The Log and Errors pages follow the server marked ●. " + (list.some(function (x) { return x.focus && !x.hasLog; }) ? "This one was started outside the editor, so it has no log here." : "")));
  }

  function renderServer() {
    var sv = S.server, hl = sv.health, nodes = [];
    renderServers(nodes);
    var focus = (sv.list || []).filter(function (x) { return x.focus; })[0];
    nodes.push(h("h2", { style: "margin-top:14px" }, focus ? "Server on port " + focus.port : "Server"));
    nodes.push(h("div", { class: "kv" },
      h("span", {}, "State"), h("span", {}, sv.running ? "running" + (focus ? " (pid " + focus.pid + ")" : "") : "stopped"),
      h("span", {}, "Port"), h("span", {}, String(focus ? focus.port : S.project.port)),
      h("span", {}, "Database"), h("span", {}, sv.db || (sv.running ? "none: Odoo visits every database" : "-")),
      hl ? h("span", {}, "Log") : null, hl ? h("span", {}, hl.errors + hl.critical + " error(s) · " + hl.warnings + " warning(s)" + (hl.http_500 ? " · " + hl.http_500 + " HTTP 500" : "")) : null));
    if (hl && hl.hint) nodes.push(h("div", { class: "hint " + (hl.state === "failed" ? "bad" : "warn") }, hl.hint));

      ["Restore a snapshot", "Roll the database back to a snapshot", "odooCi.dbSnapRestore"],
      ["Initialize the fast test database", "Prepare the template the fast test clones", "odooCi.initFastDb"]]],
    ["Maintenance", [
      ["Set up an Odoo version", "Tools, folders and the rest for one version", "odooCi.newVersion"],
      ["Tools CI", "Run the tools' own tests before a push", "odooCi.selfTest"],
      ["Version branches vs main", "Compare the 17, 18, 19 and 20 tools with main", "odooCi.syncVersions"],
      ["Project gates", "The Odoo rules the project's CI checks", "odooCi.gates"],
      ["Scan staged files for secrets", "Passwords and tokens in what you are about to commit", "odooCi.secretScan"],
      ["Install the secret pre-commit hook", "Stop a secret before it is committed", "odooCi.secretHook"],
      ["Open the layout guide", "How the folders of a version are organised", "odooCi.openLayout"],
      ["Refresh versions", "Read the versions and their projects again", "odooCi.refreshEnv"]]],
  ];

  function renderTools() {
    var nodes = [h("h2", {}, "Tools & maintenance")];
    TOOLS.forEach(function (group) {
      nodes.push(h("div", { class: "tg" }, group[0]));
      nodes.push(h("div", { class: "tools" }, group[1].map(function (t) {
        return h("button", { class: "tool", onclick: function () { send("run", { command: t[2] }); } }, h("b", {}, t[0]), h("span", {}, t[1]));
      })));
    });
    put($("tools"), nodes);
  }

  // ----------------------------------------------------------------------------- the map of one module
  var SVGNS = "http://www.w3.org/2000/svg";
  var KIND_LABEL = { focus: "This module", project: "Project", core: "Odoo", enterprise: "Odoo Enterprise", themes: "Odoo themes", third_party: "Third-party", unknown: "Not found on disk" };
  var ORIGIN_LABEL = { project: "Project", core: "Odoo", enterprise: "Odoo Enterprise", themes: "Odoo themes", third_party: "Third-party" };
  var HEX = { core: true, enterprise: true, themes: true };   // what comes from outside the project is a hexagon

  function sv(tag, attrs) {   // SVG nodes, built like the rest of the page: never from markup strings
    var el = document.createElementNS(SVGNS, tag);
    for (var k in (attrs || {})) if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) el.setAttribute(k, attrs[k]);
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) continue;
      el.appendChild(typeof c === "object" ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  function clip(text, n) { return text.length > n ? text.slice(0, n - 1) + "…" : text; }
  function shapeOf(kind, x, y, w, hgt) {
    var shape = HEX[kind]
      ? sv("polygon", { points: [x + 10, y, x + w - 10, y, x + w, y + hgt / 2, x + w - 10, y + hgt, x + 10, y + hgt, x, y + hgt / 2].join(" ") })
      : sv("rect", { x: x, y: y, width: w, height: hgt, rx: 6 });
    shape.setAttribute("class", "shape");
    return shape;
  }

  /** Columns by depth (what it needs on the left, down to the foundation; what needs it on the right), an arrow from
   *  each module to what it depends on. Pressing a module that can be opened draws its own tree. */
  function drawMap(data, onPick) {
    var W = 196, H = 28, PITCH = 38, COL = 250, PAD = 18;
    var cols = {}, min = 0, max = 0;
    data.nodes.forEach(function (n) { (cols[n.depth] = cols[n.depth] || []).push(n); min = Math.min(min, n.depth); max = Math.max(max, n.depth); });
    var rows = Math.max.apply(null, Object.keys(cols).map(function (k) { return cols[k].length; }));
    var width = (max - min) * COL + W + PAD * 2, height = rows * PITCH + PAD * 2, pos = {};
    Object.keys(cols).forEach(function (k) {
      var list = cols[k], top = PAD + (rows - list.length) * PITCH / 2;
      list.forEach(function (n, i) { pos[n.name] = { x: PAD + (n.depth - min) * COL, y: top + i * PITCH }; });
    });
    var svg = sv("svg", { class: "map", width: width, height: height, viewBox: "0 0 " + width + " " + height, role: "group", "aria-label": "Dependency tree of " + data.module });
    svg.appendChild(sv("defs", {}, sv("marker", { id: "mapArrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" },
      sv("path", { d: "M0,0 L10,5 L0,10 z", class: "arrowhead" }))));
    var edgeLayer = sv("g", {}), nodeLayer = sv("g", {}), edges = [];
    data.edges.forEach(function (e) {
      var a = pos[e[0]], b = pos[e[1]];
      if (!a || !b) return;
      var sx = a.x, sy = a.y + H / 2, tx = b.x + W, ty = b.y + H / 2, mx = (sx + tx) / 2;
      var p = sv("path", { class: "edge", d: "M" + sx + "," + sy + " C" + mx + "," + sy + " " + mx + "," + ty + " " + tx + "," + ty, "marker-end": "url(#mapArrow)", "data-from": e[0], "data-to": e[1] });
      edgeLayer.appendChild(p); edges.push(p);
    });
    data.nodes.forEach(function (n) {
      var p = pos[n.name], pick = n.openable && n.kind !== "focus";
      var g = sv("g", { class: "node mn-" + n.kind + (pick ? " open" : ""), tabindex: pick ? "0" : null, role: pick ? "button" : null,
        "aria-label": n.name + ", " + KIND_LABEL[n.kind] + (pick ? ", press to see its own tree" : ""), "data-name": n.name },
      sv("title", {}, n.name + (n.label ? " · " + n.label : "") + (n.version ? " · " + n.version : "") + " · " + KIND_LABEL[n.kind] + (n.openable ? "" : " (its folder was not found)")),
      shapeOf(n.kind, p.x, p.y, W, H),
      sv("text", { x: p.x + W / 2, y: p.y + H / 2 + 4, "text-anchor": "middle", class: "label" }, clip(n.name, 27)));
      g.addEventListener("mouseenter", function () { edges.forEach(function (el) { el.classList.toggle("hl", el.getAttribute("data-from") === n.name || el.getAttribute("data-to") === n.name); }); });
      g.addEventListener("mouseleave", function () { edges.forEach(function (el) { el.classList.remove("hl"); }); });
      if (pick) {
        g.addEventListener("click", function () { onPick(n.name); });
        g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPick(n.name); } });
      }
      nodeLayer.appendChild(g);
    });
    svg.appendChild(edgeLayer); svg.appendChild(nodeLayer);
    return { svg: svg, focusX: PAD + (0 - min) * COL + W / 2 };
  }

  var lastMapSig = null;
  function renderMap() {
    var G = S.graph, M = G && G.map, el = $("graphmap");
    if (!M) { put(el, [h("h2", {}, "Module map")]); return; }
    var data = M.data;
    // the page is redrawn every few seconds: a map that has not changed is left alone, so it does not jump while it is read
    var sig = [M.module, M.loading, M.error, M.follow, M.trail.join(","), data ? data.generation + ":" + data.nodes.length + ":" + data.edges.length : ""].join("|");
    if (sig === lastMapSig && el.firstChild) return;
    lastMapSig = sig;
    var nodes = [h("h2", {}, "Module map · the whole tree")];
    nodes.push(h("div", { class: "maptools" },
      btn("← Back", "graphBack", null, "secondary small", !M.trail.length),
      h("label", { class: "row" }, h("input", { type: "checkbox", checked: M.follow ? "checked" : false,
        onchange: function (e) { send("graphFollow", { on: e.target.checked }); } }), "Follow the file I'm editing"),
      data ? btn("Open manifest", "graphOpenModule", { module: M.module }, "secondary small") : null,
      M.trail.length ? h("span", { class: "hint" }, M.trail.concat([M.module]).join(" › ")) : null));
    if (!M.module) {
      nodes.push(h("div", { class: "empty" }, "Open a file of a module and its whole tree of dependencies is drawn here. It follows you from file to file; press a module on the map to look at that one instead."));
      put(el, nodes); return;
    }
    var focus = data && data.nodes.filter(function (n) { return n.kind === "focus"; })[0];
    nodes.push(h("div", { class: "maptitle" }, h("b", {}, M.module),
      focus ? h("span", { class: "pill idle" }, ORIGIN_LABEL[focus.origin] || focus.origin) : null,
      focus && (focus.label || focus.version) ? h("span", { class: "hint" }, [focus.label, focus.version].filter(Boolean).join(" · ")) : null,
      data ? h("span", { class: "hint" }, data.counts.dependencies + " it needs · " + data.counts.dependents + " need it · " + data.counts.outside + " outside the project" + (data.truncated ? " · cut where the map got too big" : "")) : null));
    if (M.loading) nodes.push(h("div", { class: "empty" }, "Reading the tree of " + M.module + "…"));
    else if (M.error) nodes.push(h("div", { class: "hint bad" }, M.error));
    else if (data) {
      var kinds = {};
      data.nodes.forEach(function (n) { kinds[n.kind] = true; });
      nodes.push(h("div", { class: "legend", "aria-label": "Legend" }, ["focus", "project", "core", "enterprise", "themes", "third_party", "unknown"].filter(function (k) { return kinds[k]; }).map(function (k) {
        return h("span", {}, sv("svg", { width: 22, height: 14, viewBox: "0 0 22 14", "aria-hidden": "true" }, sv("g", { class: "node mn-" + k }, shapeOf(k, 1, 1, 20, 12))), KIND_LABEL[k]);
      })));
      var drawn = drawMap(data, function (name) { send("graphMap", { module: name }); });
      var box = h("div", { class: "mapbox" }, drawn.svg);
      nodes.push(box);
      nodes.push(h("div", { class: "hint" }, "Arrows point to what a module depends on. Modules outside the project are read from their own manifests; the ones that need this module are the project's."));
      put(el, nodes);
      // a map a little wider than its box is shrunk to fit (the text stays readable); a much wider one keeps its size and scrolls,
      // starting with the module in the middle in view
      var natural = parseFloat(drawn.svg.getAttribute("width")), room = box.clientWidth, scale = room > 0 ? room / natural : 1;
      if (scale < 1 && scale >= 0.75) {
        drawn.svg.setAttribute("width", String(Math.floor(natural * scale)));
        drawn.svg.setAttribute("height", String(Math.floor(parseFloat(drawn.svg.getAttribute("height")) * scale)));
      } else {
        box.scrollLeft = Math.max(0, drawn.focusX - room / 2);
      }
      return;
    }
    put(el, nodes);
  }

  // ----------------------------------------------------------------------------- tabs and the remote servers
  function renderTabs() {
    var is = (S && S.issues) || { errors: 0, warnings: 0 };
    var tabs = [["home", "Cockpit"], ["server", "Server"], ["dbs", "Databases"], ["quality", "Quality"], ["log", "Log"], ["issues", "Errors & warnings"], ["graph", "Graph"], ["tools", "Tools"], ["remote", "Remote servers"]];
    put($("tabs"), tabs.map(function (t, index) {
      var badge = null;
      if (t[0] === "issues" && (is.errors || is.warnings)) badge = h("span", { class: "badge " + (is.errors ? "bad" : "warn") }, String(is.errors + is.warnings));
      return h("button", { class: "tab" + (ui.tab === t[0] ? " on" : ""), role: "tab", "aria-selected": ui.tab === t[0] ? "true" : "false",
        tabindex: ui.tab === t[0] ? "0" : "-1",
        onkeydown: function (e) {
          var to = e.key === "ArrowRight" ? index + 1 : e.key === "ArrowLeft" ? index - 1 : e.key === "Home" ? 0 : e.key === "End" ? tabs.length - 1 : null;
          if (to === null) return;
          e.preventDefault();
          ui.tab = tabs[(to + tabs.length) % tabs.length][0]; save(); render();
          var on = document.querySelector("#tabs .tab.on"); if (on) on.focus();
        },
        onclick: function () { ui.tab = t[0]; save(); render(); } }, t[1], badge);
    }));
    Array.prototype.forEach.call(document.querySelectorAll(".page[data-tab]"), function (el) { el.hidden = el.getAttribute("data-tab") !== ui.tab; });
  }

  function renderRemote() {
    var R = S.remote, nodes = [h("h2", {}, "Remote servers · databases over SSH")];
    if (!R) { put($("remote"), nodes); return; }
    var hosts = R.hosts || [];
    var select = h("select", { "aria-label": "Host", disabled: !!R.busy, onchange: function (e) { if (e.target.value) send("remoteSelect", { host: e.target.value }); } },
      h("option", { value: "" }, hosts.length ? "Choose a host…" : "No host in ~/.ssh/config"));
    hosts.forEach(function (x) {
      select.appendChild(h("option", { value: x.name, selected: R.host === x.name ? "selected" : false }, x.name + (x.user ? " (" + x.user + ")" : "")));
    });
    nodes.push(h("div", { class: "row" }, select,
      btn("Refresh", "remoteRefresh", null, "secondary small", !R.host || R.busy),
      btn("Push a local database…", "remotePush", { host: R.host }, "secondary small", !R.host || !R.info || R.busy),
      h("span", { class: "hint" }, "The hosts of your SSH config: the same ones Remote-SSH uses. Passwords are never stored here.")));
    if (R.job) {
      var pct = R.job.total ? Math.round(100 * R.job.step / R.job.total) : 0;
      nodes.push(h("div", { class: "progressrow" }, h("strong", {}, R.job.title || "Working"),
        h("span", {}, R.job.total ? "step " + R.job.step + " of " + R.job.total + ": " + R.job.text : R.job.text)));
      nodes.push(h("div", { class: "bar", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": String(pct) }, h("i", { style: "width:" + pct + "%" })));
    }
    if (R.error) {
      nodes.push(h("div", { class: "hint bad" }, R.error));
      if (R.refused) nodes.push(h("div", { class: "hint warn" }, "This host restricts what your account may reach" + (R.account ? " (now using the account " + R.account + ")" : "") +
        ". If it names an account that is open to you, put it in the setting odooCi.remoteSudoUser and press Refresh. The cockpit never tries another way in."));
      if (R.needsKey) nodes.push(h("div", { class: "row" }, btn("Set up key login for " + R.host + "…", "remoteKey", { host: R.host }, "small"),
        h("span", { class: "hint" }, "A terminal asks for the host's password once; after that no question is asked.")));
    }
    if (R.last) nodes.push(h("div", { class: "hint " + (R.last.level === "bad" ? "bad" : "") }, R.last.text));
    if (R.info) {
      var inst = {};
      R.info.instances.forEach(function (i) { if (i.db_name) inst[i.db_name] = i.conf.split("/").pop().replace(/\.conf$/, ""); });
      var rows = R.info.databases;
      var table = h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Database"), h("th", { class: "num" }, "MB"), h("th", {}, "Owner"), h("th", { class: "num" }, "Sessions"), h("th", {}, "Instance"), h("th", {}, ""))));
      var body = h("tbody", {});
      rows.forEach(function (d) {
        body.appendChild(h("tr", { class: "row-remote" },
          h("td", {}, d.name), h("td", { class: "num" }, String(d.size_mb)), h("td", {}, d.owner), h("td", { class: "num" }, String(d.sessions)),
          h("td", {}, inst[d.name] || ""),
          h("td", {}, btn("Pull to local", "remotePull", { host: R.host, db: d.name }, "small", R.busy), " ",
            btn("Backup file", "remoteBackup", { host: R.host, db: d.name }, "secondary small", R.busy), " ",
            btn("Drop", "remoteDrop", { host: R.host, db: d.name }, "danger small", R.busy || d.sessions > 0))));
      });
      table.appendChild(body);
      nodes.push(h("div", { class: "hint" }, rows.length + " database(s) on " + R.host + ". A pull reads the host and makes a NEW local database (never over one that exists), switched safe: no scheduled actions, no outgoing mail."));
      nodes.push(h("div", { class: "scroll" }, table));
    } else if (R.host && !R.error && !R.busy) {
      nodes.push(h("div", { class: "empty" }, "Reading " + R.host + "…"));
    } else if (!R.host) {
      nodes.push(h("div", { class: "empty" }, "Choose a host to see its databases."));
    }
    put($("remote"), nodes);
  }

  /** Without the odoo-ai tools the servers, the quality checks and the graph have nothing to run: say so once, at the top, with the way out. */
  function renderBanner() {
    var el = $("banner"), missing = S.tools && !S.tools.found;
    el.hidden = !missing;
    if (!missing) { el.textContent = ""; return; }
    put(el, [h("span", {}, "The odoo-ai tools were not found for Odoo " + S.project.version + ". Starting servers, the quality checks and the graph need them."),
      h("span", { class: "spacer" }), runBtn("Set up the tools", "odooCi.newVersion", "small"), runBtn("Read the guide", "odooCi.openGuide", "secondary small")]);
  }

  // The map is only worked out while its page is shown: the editor is told when the Graph tab opens and closes.
  var mapWasShown = null;
  function tellMapVisible() {
    var shown = ui.tab === "graph";
    if (shown !== mapWasShown) { mapWasShown = shown; send("graphMapVisible", { on: shown }); }
  }

  function render() {
    if (!S) return;
    document.body.className = S.mode === "panel" ? "panel" : "";
    renderTabs(); renderRemote();
    renderTop(); renderHome(); renderServer(); renderProgress(); renderIssues(); renderDbs(); renderModules(); renderGraph(); renderMap(); renderQuality(); renderTools(); renderBanner(); tellMapVisible();
    var keepScroll = $("log") ? $("log").scrollTop : 0;
    renderLog();
    if (!ui.autoscroll && $("log")) $("log").scrollTop = keepScroll;
    var bar = document.querySelector("#progress .bar > i");
    send("rendered", { dbRows: document.querySelectorAll("#dbs tbody tr").length, logLines: document.querySelectorAll("#log div").length,
      errorLines: document.querySelectorAll("#log div.error").length, warningLines: document.querySelectorAll("#log div.warning").length,
      issues: document.querySelectorAll("#issues .issue").length, pill: (document.querySelector("#top .pill") || {}).textContent || null,
      progressShown: !$("progress").hidden, barWidth: bar ? bar.style.width : null, modulesShown: !$("modules").hidden,
      mode: S.mode, tab: ui.tab, tabs: document.querySelectorAll("#tabs .tab").length, remoteRows: document.querySelectorAll("#remote tbody tr").length,
      remoteHosts: document.querySelectorAll("#remote select option").length - 1, bannerShown: !$("banner").hidden,
      mapNodes: document.querySelectorAll("#graphmap .mapbox .node").length });
  }

  var late = false;
  document.addEventListener("focusout", function () { if (late) { late = false; setTimeout(render, 0); } });
  var toastTimer = null;
  window.addEventListener("message", function (event) {
    var m = event.data || {};
    if (m.type === "state") {
      S = m.state;
      var a = document.activeElement;   // someone is typing or choosing: redrawing now would take the field from them
      if (a && (a.tagName === "SELECT" || (a.tagName === "INPUT" && a.type === "text"))) { late = true; return; }
      render();
    }
    else if (m.type === "tab") {
      if (typeof m.tab === "string" && document.getElementById("page-" + m.tab)) { ui.tab = m.tab; save(); render(); }   // any page the document has
    }
    else if (m.type === "toast") {
      var old = document.querySelector(".toast"); if (old) old.remove();
      var t = h("div", { class: "toast " + (m.level || "") , role: "alert" }, m.text);
      document.body.appendChild(t);
      $("live").textContent = m.text;
      clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.remove(); }, 6000);
    }
  });
  window.__cockpit = { get: function () { return S; }, ui: ui, render: render };   // for the tests
  send("ready");
})();
