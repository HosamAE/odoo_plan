; <PROJECT>.conf - one per project, inside the project, never committed.
; `odoo-ai new-project` writes it from C:\odoo\odoo17\odoo.conf (same DB user and
; passwords) with this project's addons path and its own port. To write it by hand:
; copy this file to C:\odoo\odoo17\projects\<PROJECT>\<PROJECT>.conf and fill the <...>.
[options]
pg_path = C:\Program Files\PostgreSQL\18\bin
admin_passwd = <a long random string: the database manager's master password>
db_host = 127.0.0.1
db_port = 5432
db_user = odoo17
db_password = <the PostgreSQL password of odoo17>
; PostgreSQL 18 on Windows rejects collate C != ctype (template0); template1 keeps the cluster's.
db_template = template1
db_name = False
; Odoo, then enterprise and themes when you have them, then third-party, then the project.
addons_path = C:/odoo/odoo17/odoo/addons, C:/odoo/odoo17/enterprise, C:/odoo/odoo17/design-themes, C:/odoo/odoo17/third-party, C:/odoo/odoo17/projects/<PROJECT>
http_port = <a free port, one per project>
