# odoo-kg project configuration -- acme-testing19
#
# THE CANONICAL PROJECT. This is the configuration the tool uses when no
# --config is given, and the one the registered MCP server is started with. It
# builds the M4 graph at schema version 7 for the testing19 checkout.
#
# The milestone configurations beside it (-m3, -m4, -m43) were development
# projects, each with its own data directory because a schema bump must not
# rebuild an older graph. They are kept so those graphs stay readable; none of
# them is the project to use.
#
# The data directory below already contains a `graph.db` from before generation
# publishing existed. It is never modified, converted or deleted: an index run
# writes generations/gen-<run id>/graph.db and publishes a CURRENT pointer
# beside it, and readers follow the pointer. The old file simply sits there.
#
# A second developer copies this file, gives it their own project_id, and
# points data_dir at their own %LOCALAPPDATA%\odoo-kg\projects\<id>. See the
# README's "Working in a team".
#
# This file must never contain a secret. The loader walks the parsed document
# and refuses to run if a key or value looks like a credential, so adding a
# database password or API token here breaks the tool by design.

[project]
project_id = "acme-testing19"
repo_root = "c:/odoo/ProjectsOdoo19/testing19"

# Recorded for later milestones (resolving dependencies against Odoo core).
# M1 does NOT index this tree: include_roots is repo_root only.
core_root = "c:/odoo/odoo19"

[storage]
# Must live outside every source tree and under %LOCALAPPDATA%\odoo-kg\projects.
data_dir = "C:/Users/jacob/AppData/Local/odoo-kg/projects/acme-testing19"
db_filename = "graph.db"

[odoo]
# A module's version_series_ok is true when its version starts with "19.0.".
expected_series = "19.0"

[origin]
# Modules get origin=unknown unless an explicit rule claims them. That is
# intentional: an unclaimed module is an open question, not a project module.
default = "unknown"

[origin.modules]
base_accounting_kit = "vendor"
base_account_budget = "vendor"
dynamic_accounts_report = "vendor"
website_helpdesk_support_ticket = "vendor"
membership = "core-vendored"

# Glob rules, evaluated in order, only for modules not named above.
# Deliberately empty: nothing currently claims origin=project. Uncomment and
# adapt once the project decides which prefixes it owns.
#
# [[origin.rules]]
# pattern = "acme_*"
# origin = "project"

[exclusions]
# The built-in exclusions (.git, .claude, venv, __pycache__, node_modules,
# static/lib, *.conf, *.key, credentials*, dumps, archives, logs, media, ...)
# are mandatory and cannot be switched off. These lists only add to them.
extra_dir_names = []
extra_dir_path_suffixes = []
extra_file_globs = []

[limits]
# Files larger than this are recorded with their size but not hashed.
max_hash_bytes = 8388608
