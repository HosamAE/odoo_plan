# odoo-kg project configuration -- acme-testing19-m3 (M3 development)
#
# This is the M3 milestone's own configuration. It exists so that M3 work never
# writes to the graph the live M2 server reads:
#
#   M2 (live)  config/acme-testing19.toml
#              -> %LOCALAPPDATA%\odoo-kg\projects\acme-testing19\graph.db
#   M3 (this)  config/acme-testing19-m3.toml
#              -> %LOCALAPPDATA%\odoo-kg\projects\acme-testing19-m3\graph.db
#
# The two databases carry different schema versions during development (v1 and
# v2), so sharing one file would break the running server. The inherited M2
# configuration is deliberately left untouched.
#
# This file must never contain a secret. The loader walks the parsed document
# and refuses to run if a key or value looks like a credential, so adding a
# database password or API token here breaks the tool by design.

[project]
project_id = "acme-testing19-m3"

# The same source repository as M2. It is read-only to this tool, and M3 adds
# no new include roots: Python analysis reads the files the M1 scanner already
# reaches, nothing more.
repo_root = "c:/odoo/ProjectsOdoo19/testing19"

# Recorded for later milestones (resolving models against Odoo core).
# M3.1 does NOT index this tree: include_roots is repo_root only, so a comodel
# that lives in core binds as `external` rather than becoming a node.
core_root = "c:/odoo/odoo19"

[storage]
# Separate from the M2 data directory on purpose. Must still live outside every
# source tree and under %LOCALAPPDATA%\odoo-kg\projects, which the write guard
# enforces.
data_dir = "C:/Users/jacob/AppData/Local/odoo-kg/projects/acme-testing19-m3"
db_filename = "graph.db"

[odoo]
# A module's version_series_ok is true when its version starts with "19.0.".
expected_series = "19.0"

[origin]
# Identical to M2 on purpose: origin classification is module-layer data, and
# M3's modules digest must stay bit-identical to M2's. Changing anything here
# would change that digest and mask a real regression.
default = "unknown"

[origin.modules]
base_accounting_kit = "vendor"
base_account_budget = "vendor"
dynamic_accounts_report = "vendor"
website_helpdesk_support_ticket = "vendor"
membership = "core-vendored"

[exclusions]
# The built-in exclusions are mandatory and cannot be switched off. These lists
# only add to them. Kept empty so the file set M3 sees is exactly the file set
# M2 saw -- again, so the modules digest stays comparable.
extra_dir_names = []
extra_dir_path_suffixes = []
extra_file_globs = []

[limits]
# Files larger than this are recorded with their size but not hashed.
max_hash_bytes = 8388608
