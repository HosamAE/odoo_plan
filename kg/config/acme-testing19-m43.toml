# odoo-kg project configuration -- acme-testing19-m43 (M4.3 development)
#
# Why this file exists
# --------------------
# M4.3 raises the schema from v6 to v7. The store refuses to rebuild a database
# whose schema version differs from the build's own, and that refusal is
# deliberate: it is what stopped an M3 build from destroying the live M2 graph
# earlier in this project's life. The refusal offers two ways out -- delete the
# older database, or point the build at its own project. This file is the
# second one, for the third time, and no earlier graph has been touched.
#
#   M2 (live)   config/acme-testing19.toml      -> ...\acme-testing19\      (v1)
#   M3 / M4.1   config/acme-testing19-m3.toml   -> ...\acme-testing19-m3\   (v5)
#   M4.2        config/acme-testing19-m4.toml   -> ...\acme-testing19-m4\   (v6)
#   M4.3 (this) config/acme-testing19-m43.toml  -> ...\acme-testing19-m43\  (v7)
#
# Only `data_dir` differs from the earlier configurations. Everything else,
# including `project_id`, is identical on purpose: project_id is hashed into
# every node and edge id, so changing it would change every digest and the
# comparison with M4.2 would prove nothing. Holding it constant is part of the
# comparison, not a loophole in it -- only the file the graph is written to
# has moved.
#
# This file must never contain a secret. The loader walks the parsed document
# and refuses to run if a key or value looks like a credential.

[project]
project_id = "acme-testing19-m3"

# The same source repository. Read-only to this tool.
repo_root = "c:/odoo/ProjectsOdoo19/testing19"

# Recorded for later milestones (resolving models against Odoo core). Still not
# indexed: a comodel that lives in core binds as `external` rather than
# becoming a node.
core_root = "c:/odoo/odoo19"

[storage]
data_dir = "C:/Users/jacob/AppData/Local/odoo-kg/projects/acme-testing19-m43"
db_filename = "graph.db"

[odoo]
expected_series = "19.0"

[origin]
default = "unknown"

[origin.modules]
base_accounting_kit = "vendor"
base_account_budget = "vendor"
dynamic_accounts_report = "vendor"
website_helpdesk_support_ticket = "vendor"
membership = "core-vendored"

[exclusions]
extra_dir_names = []
extra_dir_path_suffixes = []
extra_file_globs = []

[limits]
max_hash_bytes = 8388608
